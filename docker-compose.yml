services:
  # 1. Base de datos origen (CouchDB)
  couchdb:
    image: couchdb:3.3.3
    container_name: pipeline_couchdb
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpassword
    ports:
      - "5984:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data

  # 2. Caché, Pub/Sub y estado en memoria (Redis Stack con RedisJSON)
  redis:
    image: redis/redis-stack:latest
    container_name: pipeline_redis
    ports:
      - "6379:6379" # Redis Server
      - "8001:8001" # RedisInsight (Panel gráfico web para ver los datos)
    restart: always

  # 3. Motor de indexación y búsqueda (Elasticsearch)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: pipeline_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

volumes:
  couchdb_data:
